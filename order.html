<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์เฉพาะหน้าสั่งซื้อ */
    .order-box {
      max-width: 560px;
      margin: 0 auto;
      padding: var(--space-4);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    .form-field {
      margin-bottom: var(--space-3);
    }

    .form-field label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.92rem;
      color: var(--ink-soft);
    }

    .form-field input,
    .form-field textarea {
      width: 100%;
      padding: 0.8rem 1rem;
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 300;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      transition: border-color 0.3s;
    }

    .form-field textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-field input:focus,
    .form-field textarea:focus {
      outline: none;
      border-color: var(--bronze);
    }

    .order-box .btn {
      width: 100%;
      margin-top: var(--space-2);
    }

    @media (max-width: 640px) {
      .order-box {
        padding: var(--space-3) var(--space-2);
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head is-center">
          <h1>สั่งซื้อสินค้า</h1>
          <div class="heading-rule" aria-hidden="true"></div>
        </div>

        <div class="order-box">
          <form id="orderForm">
            <div class="form-field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="form-field">
              <label for="contact">เบอร์โทร / Line</label>
              <input type="text" id="contact" name="contact" autocomplete="tel" required>
            </div>

            <div class="form-field">
              <label for="items">รายการสินค้า</label>
              <input type="text" id="items" name="items" required>
            </div>

            <div class="form-field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input type="number" id="total" name="total" min="0" required>
            </div>

            <div class="form-field">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" name="note"></textarea>
            </div>

            <button type="submit" class="btn btn--primary">ยืนยันสั่งซื้อ</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <p style="margin: 0 auto;">&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
