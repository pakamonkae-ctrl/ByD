<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการคำสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์เฉพาะหน้าแอดมิน */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2);
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--line-soft);
    }

    #ordersTable thead th {
      font-family: var(--font-serif-th);
      font-weight: 500;
      color: var(--ink);
      background: var(--cream);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable td {
      color: var(--ink-soft);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head is-center">
          <h1>รายการคำสั่งซื้อ</h1>
          <div class="heading-rule" aria-hidden="true"></div>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <p style="margin: 0 auto;">&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
